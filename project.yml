# Generated with XcodeGen: `xcodegen generate` (or `make project`).
#
# The .xcodeproj is not committed, for the same reason as blaze-ios: a
# project.pbxproj is generated, conflicts badly, and adding a source file here
# is a one-line diff instead of a merge hazard.
name: SafeRoom
options:
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

# Team and bundle ID: Config/Identity.xcconfig is the only place they are set.
configFiles:
  Debug: Config/Identity.xcconfig
  Release: Config/Identity.xcconfig

packages:
  SafeRoomCore:
    path: .

settings:
  base:
    MARKETING_VERSION: "0.1.4"
    CURRENT_PROJECT_VERSION: "19"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: $(SAFEROOM_TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    # Notarization refuses anything without the hardened runtime.
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  SafeRoom:
    type: application
    platform: macOS
    sources: [App/Sources, App/Assets.xcassets]
    dependencies:
      # Embedding a system-extension target puts it in
      # Contents/Library/SystemExtensions, which is the only place
      # OSSystemExtensionRequest looks.
      - target: SafeRoomDNSProxy
      # For the XPC protocol and the status format.
      - package: SafeRoomCore
        product: SafeRoomCore
    settings:
      base:
        PRODUCT_NAME: SafeRoom
        PRODUCT_BUNDLE_IDENTIFIER: $(SAFEROOM_APP_ID)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SafeRoom
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/Resources/SafeRoom.entitlements
      # Dev controls (proxy buttons, -TestPolicy) are in Debug builds, and in
      # a release only with `make release DEV_CONTROLS=1`.
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG SAFEROOM_DEV_CONTROLS"

  SafeRoomDNSProxy:
    type: system-extension
    platform: macOS
    sources: [Extension/Sources]
    dependencies:
      - package: SafeRoomCore
        product: SafeRoomCore
    settings:
      base:
        # The extension's bundle ID must start with the app's.
        PRODUCT_BUNDLE_IDENTIFIER: $(SAFEROOM_APP_ID).dnsproxy
        PRODUCT_NAME: $(SAFEROOM_APP_ID).dnsproxy
        PRODUCT_MODULE_NAME: SafeRoomDNSProxy
        INFOPLIST_FILE: Extension/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extension/Resources/DNSProxy.entitlements

# Declared, shared scheme. Without it xcodegen deletes the per-user scheme on
# every regeneration (see blaze-ios/project.yml).
schemes:
  SafeRoom:
    build:
      targets:
        SafeRoom: all
        SafeRoomDNSProxy: all
    test:
      targets:
        - package: SafeRoomCore/SafeRoomCoreTests
    archive:
      config: Release
